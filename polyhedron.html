<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polyhedra as intersections of halfspaces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F4F6F3;
  --ink:#1B2430;
  --ink-soft:#4A5361;
  --muted:#8A929E;
  --rule:#CFD5D9;
  --feasible:#2F6F9F;
  --feasible-fill:rgba(47,111,159,.28);
  --half-fill:rgba(47,111,159,.10);
  --accent:#A8325E;
  --accent-fill:rgba(168,50,94,.12);
  --objective:#8F5500;
  --objective-fill:rgba(143,85,0,.14);
  --grid:#E3E7E6;
  --axis:#B7BEC5;
  --panel:#FFFFFF;
  --focus:#2F6F9F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15191F; --ink:#E8ECEF; --ink-soft:#B4BCC6; --muted:#7D8792; --rule:#2C333C;
    --feasible:#6FB0E0; --feasible-fill:rgba(111,176,224,.30); --half-fill:rgba(111,176,224,.10);
    --accent:#E27AA6; --accent-fill:rgba(226,122,166,.14);
    --objective:#E3A63A; --objective-fill:rgba(227,166,58,.16);
    --grid:#1F252D; --axis:#3B434D; --panel:#1B2027; --focus:#6FB0E0;
  }
}
:root[data-theme="dark"]{
  --paper:#15191F; --ink:#E8ECEF; --ink-soft:#B4BCC6; --muted:#7D8792; --rule:#2C333C;
  --feasible:#6FB0E0; --feasible-fill:rgba(111,176,224,.30); --half-fill:rgba(111,176,224,.10);
  --accent:#E27AA6; --accent-fill:rgba(226,122,166,.14);
  --objective:#E3A63A; --objective-fill:rgba(227,166,58,.16);
  --grid:#1F252D; --axis:#3B434D; --panel:#1B2027; --focus:#6FB0E0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"Newsreader",Georgia,"Times New Roman",serif;font-size:clamp(17px,1.6vw,24px);line-height:1.4;}
*,*::before,*::after{box-sizing:inherit}
i,.v{font-style:italic}
.deck{height:100%;display:flex;flex-direction:column}
.slide{display:none;flex:1;min-height:0;padding:clamp(18px,3.5vh,44px) clamp(20px,4vw,72px);overflow:auto}
.slide.on{display:flex;flex-direction:column}
.slide h1{font-weight:500;font-size:2.4em;line-height:1.1;margin:0 0 .3em;letter-spacing:-.01em}
.slide h2{font-weight:500;font-size:1.75em;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
.slide p{margin:.35em 0;max-width:34em}
.lede{color:var(--ink-soft)}
.kicker{color:var(--muted);font-size:.85em;margin-bottom:.6em}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:clamp(14px,2.5vw,40px);flex:1;min-height:0}
.two > figure{margin:0;min-width:0;display:flex;align-items:center}
.two svg.board{width:100%;height:auto;max-height:100%;display:block;background:var(--panel);border:1px solid var(--rule);border-radius:6px;touch-action:none;user-select:none}
.panel{display:flex;flex-direction:column;gap:.9em;font-size:.92em;min-width:0}
.formula{font-size:1.15em;line-height:1.6}
.formula .row{display:flex;align-items:baseline;gap:.5em;padding:.08em .4em;border-radius:4px;cursor:default}
.formula .row.hot{background:var(--accent-fill)}
.formula .row .tag{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--accent);transform:translateY(-.05em);flex:none}
.formula .row .x{margin-left:auto;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0 .3em;line-height:1}
.formula .row .x:hover{color:var(--accent)}
.brace{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:.5em .8em;align-items:center}
button.btn{font:inherit;font-size:.95em;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:.3em .8em;cursor:pointer}
button.btn:hover{border-color:var(--ink-soft)}
button.btn:focus-visible,input:focus-visible,.hit:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
label.chk{display:inline-flex;align-items:center;gap:.4em;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--objective)}
.readout{color:var(--ink-soft)}
.readout b{font-weight:500;color:var(--ink)}
.note{color:var(--muted);font-size:.85em;max-width:30em}
.status{min-height:1.4em}
.status.warn{color:var(--accent)}
.nav{flex:none;display:flex;justify-content:space-between;align-items:center;padding:.4em clamp(20px,4vw,72px) .7em;color:var(--muted);font-size:.8em;border-top:1px solid var(--rule)}
.nav button{font:inherit;background:none;border:0;color:var(--ink-soft);cursor:pointer;padding:.2em .5em}
.nav button:hover{color:var(--ink)}
.nav .mid{display:flex;gap:1.2em;align-items:center}
.map{width:100%;height:auto;max-height:100%;display:block}
.map text{font-family:inherit;fill:var(--ink)}
.map .soft{fill:var(--ink-soft)}
.map .mut{fill:var(--muted)}
.map .box{fill:var(--panel);stroke:var(--rule);stroke-width:1.2}
.map .band{fill:var(--feasible-fill);stroke:var(--feasible);stroke-width:1.2}
.map .top{fill:var(--panel);stroke:var(--ink);stroke-width:1.4}
.map .dash{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:6 5}
.map .arr{fill:none;stroke:var(--ink-soft);stroke-width:1.4}
.map .arr2{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:5 4}
.figwrap{flex:1;min-height:0;display:flex;align-items:center;margin:0}
.claims{font-size:1.15em;line-height:1.5;max-width:36em}
.claims li{margin:.5em 0}
.claims ol{padding-left:1.4em}
@media (max-width:900px){
  .two{grid-template-columns:1fr}
  .two > figure{align-items:flex-start}
  body{font-size:17px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
<style>
.slide{display:flex!important;min-height:100vh}
.two > figure{align-items:flex-start}
.topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:16px;z-index:5}
.topbar button{font:inherit;font-size:.75em;background:none;border:0;color:var(--muted);cursor:pointer}
</style>
</head>
<body>
<div class="topbar"><button id="theme" aria-label="Toggle light or dark">Light / dark</button></div>
<section class="slide on" data-title="Polyhedra">
  <h2>A polyhedron is a finite intersection of halfspaces</h2>
  <div class="two">
    <figure>
      <svg id="poly" class="board" viewBox="0 0 760 560" role="img" aria-label="Interactive: halfspaces with their normal vectors and the shaded polyhedron they cut out"></svg>
    </figure>
    <div class="panel">
      <div class="formula" id="polyFormula"></div>
      <div class="controls">
        <button class="btn" id="polyAdd">Add a halfspace</button>
        <button class="btn" id="polyReset">Reset</button>
        <label class="chk"><input type="checkbox" id="polyVerts"> Show vertices</label>
      </div>
      <div class="status" id="polyStatus"></div>
      <p class="note">Drag an arrow tip to rotate or stretch <i>a</i>. Drag a line to move it; that changes <i>b</i>. Hover a row to see which halfspace it is.</p>
    </div>
  </div>
</section>
<script>
(function(){
'use strict';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark'};
/* ---------- helpers ---------- */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function fmt(v){const s=(Math.round(v*10)/10).toFixed(1);return s==='-0.0'?'0.0':s;}
function ineq(a,b){ // a1 x + a2 y <= b as html
  const term=(c,v,first)=>{const ab=Math.abs(c);const num=ab===1?'':fmt(ab);const sign=c<0?'−':(first?'':'+');
    if(Math.abs(c)<1e-9)return '';return (first?(c<0?'−':''):(' '+sign+' '))+num+'<i>'+v+'</i>';};
  let s=term(a[0],'x',true);const t2=term(a[1],'y',s==='');s+=t2;if(s==='')s='0';return s+' ≤ '+fmt(b);}
function clip(poly,a,b){ // keep a·p <= b
  const out=[];const n=poly.length;if(!n)return out;
  for(let i=0;i<n;i++){const P=poly[i],Q=poly[(i+1)%n];const sp=a[0]*P[0]+a[1]*P[1]-b,sq=a[0]*Q[0]+a[1]*Q[1]-b;
    if(sp<=1e-9)out.push(P);
    if((sp<-1e-9&&sq>1e-9)||(sp>1e-9&&sq<-1e-9)){const t=sp/(sp-sq);out.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])]);}}
  const ded=[];for(const p of out){const q=ded[ded.length-1];if(!q||Math.hypot(p[0]-q[0],p[1]-q[1])>1e-7)ded.push(p);}
  if(ded.length>1){const f=ded[0],l=ded[ded.length-1];if(Math.hypot(f[0]-l[0],f[1]-l[1])<1e-7)ded.pop();}
  return ded;}
function intersectAll(cons,B){let poly=[[-B,-B],[B,-B],[B,B],[-B,B]];for(const c of cons){poly=clip(poly,c.a,c.b);if(poly.length<3)return poly;}return poly;}

/* ---------- board: shared world<->svg ---------- */
function makeBoard(svg,W,H,S){
  const cx=W/2,cy=H/2;
  const toS=(x,y)=>[cx+x*S,cy-y*S];const toW=(px,py)=>[(px-cx)/S,(cy-py)/S];
  const xr=W/2/S,yr=H/2/S;
  const g=el('g',{},svg);
  for(let x=Math.ceil(-xr);x<=xr;x++){const [px]=toS(x,0);el('line',{x1:px,y1:0,x2:px,y2:H,stroke:'var(--grid)','stroke-width':1},g);}
  for(let y=Math.ceil(-yr);y<=yr;y++){const [,py]=toS(0,y);el('line',{x1:0,y1:py,x2:W,y2:py,stroke:'var(--grid)','stroke-width':1},g);}
  el('line',{x1:0,y1:cy,x2:W,y2:cy,stroke:'var(--axis)','stroke-width':1.2},g);
  el('line',{x1:cx,y1:0,x2:cx,y2:H,stroke:'var(--axis)','stroke-width':1.2},g);
  for(let x=Math.ceil(-xr);x<=xr;x++){if(!x)continue;const [px]=toS(x,0);el('text',{x:px,y:cy+16,'text-anchor':'middle','font-size':11,fill:'var(--muted)'},g).textContent=x;}
  for(let y=Math.ceil(-yr);y<=yr;y++){if(!y)continue;const [,py]=toS(0,y);el('text',{x:cx-6,y:py+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'},g).textContent=y;}
  const pt=svg.createSVGPoint();
  function pointer(ev){pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());return toW(p.x,p.y);}
  return {toS,toW,pointer,W,H,S};
}
function polyPath(pts,toS){if(!pts.length)return '';return pts.map((p,i)=>(i?'L':'M')+toS(p[0],p[1]).join(' ')).join(' ')+' Z';}
function linePath(a,b,toS){ // a·x=b, long segment through anchor
  const n=Math.hypot(a[0],a[1]);if(n<1e-9)return '';const p=[a[0]*b/(n*n),a[1]*b/(n*n)];const d=[-a[1]/n,a[0]/n];const L=60;
  const P=toS(p[0]-L*d[0],p[1]-L*d[1]),Q=toS(p[0]+L*d[0],p[1]+L*d[1]);return 'M'+P.join(' ')+' L'+Q.join(' ');}
function arrowMarker(svg,id,color){const d=el('defs',{},svg);const mk=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},d);el('path',{d:'M0 0 L10 5 L0 10 z',fill:color},mk);}

/* ---------- slide 5: halfspaces ---------- */
(function(){
  const svg=document.getElementById('poly');const W=760,H=560,S=54;
  const B=makeBoard(svg,W,H,S);arrowMarker(svg,'aHead','var(--accent)');
  const defaults=()=>[{a:[1,1],b:6},{a:[-1,1],b:3},{a:[0,-1],b:2},{a:[-1,-0.5],b:4},{a:[1,-2],b:5}].map(c=>{const n2=c.a[0]**2+c.a[1]**2;return {a:c.a.slice(),b:c.b,p:[c.a[0]*c.b/n2,c.a[1]*c.b/n2]};});
  let cons=defaults();let hot=-1,drag=null;
  const gHalf=el('g',{},svg),gFill=el('g',{},svg),gLines=el('g',{},svg),gArr=el('g',{},svg),gVerts=el('g',{},svg),gLabel=el('g',{},svg);
  const formula=document.getElementById('polyFormula'),status=document.getElementById('polyStatus'),chk=document.getElementById('polyVerts');
  function render(){
    [gHalf,gFill,gLines,gArr,gVerts,gLabel].forEach(g=>{while(g.firstChild)g.removeChild(g.firstChild);});
    const poly=intersectAll(cons,60);
    if(hot>=0&&cons[hot]){const c=cons[hot];const hp=clip([[-60,-60],[60,-60],[60,60],[-60,60]],c.a,c.b);el('path',{d:polyPath(hp,B.toS),fill:'var(--accent-fill)'},gHalf);}
    if(poly.length>=3)el('path',{d:polyPath(poly,B.toS),fill:'var(--feasible-fill)',stroke:'var(--feasible)','stroke-width':1.5},gFill);
    cons.forEach((c,i)=>{
      const isHot=i===hot;
      el('path',{d:linePath(c.a,c.b,B.toS),fill:'none',stroke:isHot?'var(--accent)':'var(--ink-soft)','stroke-width':isHot?2.4:1.6},gLines);
      const hit=el('path',{d:linePath(c.a,c.b,B.toS),fill:'none',stroke:'transparent','stroke-width':16,class:'hit',style:'cursor:move'},gLines);
      hit.addEventListener('pointerdown',ev=>{drag={i,kind:'line'};hot=i;svg.setPointerCapture(ev.pointerId);render();});
      hit.addEventListener('pointerenter',()=>{if(!drag){hot=i;render();}});
      const P=B.toS(c.p[0],c.p[1]),T=B.toS(c.p[0]+c.a[0],c.p[1]+c.a[1]);
      el('line',{x1:P[0],y1:P[1],x2:T[0],y2:T[1],stroke:'var(--accent)','stroke-width':2.2,'marker-end':'url(#aHead)'},gArr);
      el('circle',{cx:P[0],cy:P[1],r:3.2,fill:'var(--accent)'},gArr);
      const tip=el('circle',{cx:T[0],cy:T[1],r:11,fill:'transparent',stroke:isHot?'var(--accent)':'transparent','stroke-width':1.2,style:'cursor:grab'},gArr);
      tip.addEventListener('pointerdown',ev=>{drag={i,kind:'tip'};hot=i;svg.setPointerCapture(ev.pointerId);render();ev.stopPropagation();});
      tip.addEventListener('pointerenter',()=>{if(!drag){hot=i;render();}});
      const lab=el('text',{x:T[0]+10,y:T[1]-6,'font-size':14,fill:'var(--accent)','font-style':'italic'},gLabel);lab.textContent='a';const sub=el('tspan',{'baseline-shift':'sub','font-size':10,'font-style':'normal'},lab);sub.textContent=i+1;
    });
    if(chk.checked&&poly.length>=3)poly.forEach(v=>{if(Math.abs(v[0])<59&&Math.abs(v[1])<59){const Q=B.toS(v[0],v[1]);el('circle',{cx:Q[0],cy:Q[1],r:5,fill:'var(--panel)',stroke:'var(--feasible)','stroke-width':2},gVerts);}});
    // formula
    let h='<span class="brace"><i>P</i> = { (<i>x</i>, <i>y</i>) :</span>';
    cons.forEach((c,i)=>{h+='<div class="row'+(i===hot?' hot':'')+'" data-i="'+i+'"><span class="tag"></span><span>'+ineq(c.a,c.b)+'</span><button class="x" data-i="'+i+'" aria-label="Remove halfspace '+(i+1)+'">×</button></div>';});
    h+='<span class="brace">}</span>';formula.innerHTML=h;
    formula.querySelectorAll('.row').forEach(r=>{r.addEventListener('pointerenter',()=>{hot=+r.dataset.i;render();});});
    formula.querySelectorAll('.x').forEach(b=>{b.onclick=()=>{cons.splice(+b.dataset.i,1);hot=-1;render();};});
    const unb=poly.length>=3&&poly.some(v=>Math.abs(v[0])>59||Math.abs(v[1])>59);
    status.className='status'+(poly.length<3?' warn':'');
    status.textContent=poly.length<3?'The polyhedron is empty: no point satisfies every inequality.':(unb?'Nonempty and unbounded.':'Nonempty and bounded, with '+poly.length+' vertices.');
  }
  svg.addEventListener('pointermove',ev=>{if(!drag)return;const c=cons[drag.i];if(!c)return;const q=B.pointer(ev);
    if(drag.kind==='tip'){const a=[q[0]-c.p[0],q[1]-c.p[1]];if(Math.hypot(a[0],a[1])<0.15)return;c.a=a;c.b=a[0]*c.p[0]+a[1]*c.p[1];}
    else{const nb=c.a[0]*q[0]+c.a[1]*q[1];const n2=c.a[0]**2+c.a[1]**2;const t=(nb-c.b)/n2;c.p=[c.p[0]+t*c.a[0],c.p[1]+t*c.a[1]];c.b=nb;}
    render();});
  const stop=()=>{drag=null;};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
  svg.addEventListener('pointerleave',()=>{if(!drag){hot=-1;render();}});
  formula.addEventListener('pointerleave',()=>{if(!drag){hot=-1;render();}});
  document.getElementById('polyAdd').onclick=()=>{const th=Math.random()*Math.PI*2;const a=[Math.cos(th)*1.2,Math.sin(th)*1.2];const b=2.5+Math.random()*2;const n2=a[0]**2+a[1]**2;cons.push({a,b,p:[a[0]*b/n2,a[1]*b/n2]});hot=cons.length-1;render();};
  document.getElementById('polyReset').onclick=()=>{cons=defaults();hot=-1;render();};
  chk.onchange=render;
  render();
})();

})();
</script>
</body>
</html>
